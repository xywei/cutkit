default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0
    hooks:
      - id: ruff-format
      - id: ruff

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest -q
        entry: uv run pytest -q
        language: system
        pass_filenames: false

      - id: no-main-push
        name: block direct pushes to main
        entry: scripts/block-main-push.sh
        language: script
        pass_filenames: false
        stages: [pre-push]
