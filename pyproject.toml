[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cutkit"
version = "0.1.0"
description = "Cut-cell Utilities for Trimming, Kernel Integration, and Topology."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "xywei"}
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8"
]
forms = [
  "ufl>=2017.1.0"
]
dgsem = [
  "grudge==2021.1",
  "meshmode==2021.2",
  "loopy==2024.1",
  "modepy==2021.1",
  "pymbolic==2024.2.2",
  "pytools==2024.1.21"
]
perf = [
  "numpy>=2"
]
cad = [
  "cadquery-ocp>=7.8"
]
dev = [
  "mypy>=1.11",
  "prek>=0.3.5",
  "pytest>=8",
  "ruff>=0.11"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
warn_unused_configs = true
pretty = true
