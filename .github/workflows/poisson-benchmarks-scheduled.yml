name: Poisson Benchmarks (Scheduled)

on:
  schedule:
    - cron: "23 9 * * 0"
  workflow_dispatch:

jobs:
  dense-poisson-benchmarks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend-mode: ["jplus", "folded"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --extra dev

      - name: Run dense Poisson benchmark
        run: |
          uv run python scripts/run_poisson_benchmarks.py \
            --profile dense \
            --backend-mode ${{ matrix.backend-mode }} \
            --manifest-path poisson-benchmark-${{ matrix.backend-mode }}.json

      - name: Upload benchmark manifests
        uses: actions/upload-artifact@v4
        with:
          name: poisson-benchmarks-${{ matrix.backend-mode }}
          path: poisson-benchmark-${{ matrix.backend-mode }}.json
